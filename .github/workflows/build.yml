name: Build Windows release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $v = (Select-String -Path app/version.py -Pattern 'VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $code = 0
          try { gh api "repos/${{ github.repository }}/releases/tags/v$v" *> $null; $code = $LASTEXITCODE } catch { $code = 1 }
          if ($code -eq 0) { "exists=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8 } else { "exists=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8 }
          exit 0
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Skip if release exists
        if: steps.ver.outputs.exists == 'true'
        run: echo "v${{ steps.ver.outputs.version }} already released, skipping"
      - uses: actions/setup-python@v5
        if: steps.ver.outputs.exists != 'true'
        with:
          python-version: "3.11"
      - name: Install deps
        if: steps.ver.outputs.exists != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pywebview imageio-ffmpeg onnxruntime pillow numpy pycapcut truststore certifi
      - name: Build exe
        if: steps.ver.outputs.exists != 'true'
        run: pyinstaller --noconfirm --clean build/app.spec
      - name: Smoke test import
        if: steps.ver.outputs.exists != 'true'
        shell: pwsh
        run: |
          Get-ChildItem dist/VVReels | Select-Object -First 5
          if (!(Test-Path "dist/VVReels/VVReels.exe")) { throw "exe missing" }
      - name: Portable zip
        if: steps.ver.outputs.exists != 'true'
        shell: pwsh
        run: Compress-Archive -Path "dist/VVReels/*" -DestinationPath "dist/VVReels-win-${{ steps.ver.outputs.version }}.zip" -Force
      - name: Installer (Inno Setup)
        if: steps.ver.outputs.exists != 'true'
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc /DAppVersion=${{ steps.ver.outputs.version }} build\installer.iss
      - name: Release notes from commit message
        if: steps.ver.outputs.exists != 'true'
        shell: bash
        run: |
          git log -1 --pretty=%B | grep -v -e 'Co-Authored-By' -e 'Claude-Session' | sed -e 's/^[0-9.]*[：:]\s*//' > release_notes.md
          echo "${{ steps.ver.outputs.version }}" > notes_head.md
          { cat notes_head.md; sed 's/^/- /' release_notes.md | sed 's/^- $//'; } > body.md
          cat body.md
      - name: Release
        if: steps.ver.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          body_path: body.md
          files: |
            dist/VVReels-Setup-${{ steps.ver.outputs.version }}.exe
            dist/VVReels-win-${{ steps.ver.outputs.version }}.zip
