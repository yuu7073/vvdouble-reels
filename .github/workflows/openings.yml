name: Render openings
on:
  push:
    branches: [main]
    paths: ["openings/**", ".github/workflows/openings.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
      - run: cd openings && npm i --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Decide what to render (only ids missing from the release, unless commit says [render all] or ids are given)
        id: pick
        env: { GH_TOKEN: "${{ github.token }}", MSG: "${{ github.event.head_commit.message }}" }
        run: |
          have=$(gh api repos/${{ github.repository }}/releases/tags/openings -q '.assets[].name' 2>/dev/null | grep -E '^[0-9]+\.mov$' | sed 's/\.mov$//' | tr '\n' ' ' || true)
          only=""
          if echo "$MSG" | grep -q '\[render all\]'; then only=""
          elif echo "$MSG" | grep -qoE '\[render [0-9 ]+\]'; then only=$(echo "$MSG" | grep -oE '\[render [0-9 ]+\]' | head -1 | sed 's/\[render //;s/\]//')
          else for f in openings/src/*.dc.html; do id=$(basename "$f" .dc.html); printf ' %s ' $have | grep -q " $id " || only="$only $id"; done; [ -z "$only" ] && only="none"; fi
          echo "only=$only" >> "$GITHUB_OUTPUT"; echo "render: ${only:-all}"
      - run: RENDER_ONLY="${{ steps.pick.outputs.only }}" bash openings/build.sh
      - name: Upload to release "openings"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: openings
          name: 開頭動畫庫
          prerelease: true
          body: "工具啟動時自動下載到 官網部門\\開頭動畫。帶透明的 ProRes 4444 .mov，1080x1920 30fps。"
          files: |
            openings/mov/*.mov
            openings/mov/*.webm
            openings/mov/*.json
            openings/mov/*.png
