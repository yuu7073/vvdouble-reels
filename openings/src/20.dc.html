<style>
html,body{margin:0;overflow:hidden;scrollbar-width:none}
a{color:#fff}a:hover{color:#eee}
.z-vid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:zVid 4.8s ease infinite}
.z-big{animation:zBig 4.8s cubic-bezier(.16,1,.3,1) infinite}
.z-pre{animation:zPre 4.8s ease infinite}
.z-q{animation:zQ 4.8s ease infinite}
.z-rule{animation:zRule 4.8s cubic-bezier(.6,0,.2,1) infinite}
@keyframes zVid{0%{filter:brightness(.55)}30%,100%{filter:brightness(.82)}}
@keyframes zBig{0%,4%{opacity:0;letter-spacing:1.1em;filter:blur(10px)}34%,94%{opacity:1;letter-spacing:0.04em;filter:blur(0)}100%{opacity:0;letter-spacing:0.04em}}
@keyframes zPre{0%,24%{opacity:0}34%,94%{opacity:1}100%{opacity:0}}
@keyframes zQ{0%,38%{opacity:0;transform:translateY(10px)}50%,94%{opacity:1;transform:none}100%{opacity:0}}
@keyframes zRule{0%,30%{transform:scaleX(0)}44%,94%{transform:scaleX(1);opacity:1}100%{opacity:0}}
</style>
</helmet>
<div style="width: 405px; height: 720px; position: relative; overflow: hidden; background: #141312; font-family: 'Inter', sans-serif; color: #ffffff">

</div>
